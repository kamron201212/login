<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

<div class="relative flex h-screen w-screen items-center justify-center overflow-hidden bg-gradient-to-br from-[#1f1124] to-[#0d1127] font-sans antialiased select-none">
  
  <div class="pointer-events-none absolute left-[20%] top-[10%] h-[500px] w-[500px] rounded-full bg-red-600/40 blur-[130px]"></div>
  <div class="pointer-events-none absolute bottom-[10%] right-[15%] h-[600px] w-[600px] rounded-full bg-blue-500/30 blur-[160px]"></div>

  <div class="z-10 flex h-[560px] w-[420px] flex-col items-center justify-between rounded-[45px] border border-white/15 bg-white/5 p-10 shadow-2xl backdrop-blur-[35px]">
    
    <div class="mt-4 flex h-28 w-28 items-center justify-center rounded-full bg-white/10 text-white/30">
      <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="h-16 w-16" viewBox="0 0 24 24">
        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
      </svg>
    </div>

    <form id="login-form" class="w-full space-y-6"> 
      
      <div class="relative border-b border-white/40 pb-2 focus-within:border-white transition-colors">
        <span class="absolute left-0 top-1 text-white/60">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.92V6.75" />
          </svg>
        </span>
        <input id="email" type="email" placeholder="Email" class="w-full bg-transparent pl-8 text-white placeholder-white/50 outline-none text-base tracking-wide" />
      </div>

      <div class="relative border-b border-white/40 pb-2 focus-within:border-white transition-colors">
        <span class="absolute left-0 top-1 text-white/60">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25z" />
          </svg>
        </span>
        <input id="password" type="password" placeholder="Пароль" class="w-full bg-transparent pl-8 text-white placeholder-white/50 outline-none text-base tracking-wide" />
      </div>

      <div class="flex items-center justify-between text-xs text-white/60 pt-2">
        <label class="flex items-center space-x-2 cursor-pointer select-none">
          <input id="remember" type="checkbox" class="accent-indigo-500 rounded border-none bg-white/20 w-4 h-4 cursor-pointer" />
          <span>Запомнить</span>
        </label>
        <a href="#" class="italic hover:text-white transition-colors">Забыли пароль?</a>
      </div>
      
      <div id="error-message" class="hidden text-red-400 text-xs text-center mt-2">
        Заполните всё
      </div>

      <button type="submit" class="w-full rounded-2xl bg-gradient-to-r from-[#3e0827] via-[#212c75] to-[#5a7ae6] py-3.5 text-center font-bold tracking-[0.15em] text-white uppercase shadow-lg transition-all hover:brightness-110 active:scale-[0.98] cursor-pointer">
        Войти
      </button>
    </form>
  </div>
</div>

<div id="result-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md transition-opacity duration-300">
  <div class="w-[400px] bg-[#161129]/90 border border-white/20 p-8 rounded-[35px] text-white shadow-2xl text-center space-y-6">            
    <h2 class="text-2xl font-bold text-green-400 tracking-wide">Готово</h2>
    <p class="text-white/60 text-sm">То, что пришло:</p>    
    <div class="bg-white/5 border border-white/10 rounded-2xl p-4 text-left space-y-3 font-mono text-sm">
      <div><span class="text-purple-400">Почта:</span> <span id="res-email" class="text-white break-all"></span></div>
      <div><span class="text-purple-400">Пароль:</span> <span id="res-password" class="text-white break-all"></span></div>
      <div><span class="text-purple-400">Запомнить:</span> <span id="res-remember" class="text-white"></span></div>
    </div>  
    <button id="close-modal" class="w-full py-3 bg-white/10 hover:bg-white/20 active:scale-95 border border-white/20 rounded-xl font-semibold tracking-wide transition-all cursor-pointer">
      Закрыть
    </button>
  </div>
</div>

</body>
<script src="test.js"></script>
</html>
